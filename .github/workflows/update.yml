name: 每日更新市场过热指标
on:
  schedule:
    - cron: '50 07 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓取行情（失败自动重试）
        run: |
          TODAY=$(date +%F)
          for i in 1 2 3; do
            python update_heat.py
            if grep -q "\"date\": \"$TODAY\"" state/avg_price.jsonl; then
              echo "已写入 $TODAY 数据"
              exit 0
            fi
            if [ $i -lt 3 ]; then
              echo "未获取到 $TODAY 数据，10 分钟后第 $((i+1)) 次重试"
              sleep 600
            else
              echo "重试 3 次后仍未获取到 $TODAY 数据，今日数据缺失"
            fi
          done
      - name: 提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: market update $(date +%F_%H%M)" || exit 0
          git push
